version: '3.8'

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: califnco_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
      # Califnco Backend Bridge
      - CALIFNCO_BACKEND_URL=https://califnco-backend.onrender.com
      - AUTOMATION_CRON_SECRET=califnco_auto_secret_2026
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/data/workflows

volumes:
  n8n_data:
