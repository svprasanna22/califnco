name: Daily Autonomous Instagram Product Posting

on:
  schedule:
    # Executes once daily at 10:00 AM IST (04:30 UTC)
    # Cron format: Minute (30) Hour (4) Day-of-month (*) Month (*) Day-of-week (*)
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force execution even if already posted today'
        required: false
        default: 'false'
        type: boolean
      target_product_id:
        description: 'Specific Product ID to post (optional)'
        required: false
        type: string

jobs:
  publish_instagram_post:
    name: Execute Daily AI Instagram Post
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger Daily AI Instagram Publication Endpoint
        id: trigger_post
        run: |
          echo "========================================================"
          echo "Triggering Califnco Daily AI Instagram Workflow..."
          echo "Time (UTC): $(date -u)"
          echo "========================================================"

          BACKEND_URL="${{ secrets.BACKEND_API_URL || 'https://califnco-backend.onrender.com' }}"
          CRON_SECRET="${{ secrets.AUTOMATION_CRON_SECRET }}"
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Missing repository secret: AUTOMATION_CRON_SECRET. Please configure this secret in GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          FORCE_PARAM="${{ github.event.inputs.force || 'false' }}"
          TARGET_PROD="${{ github.event.inputs.target_product_id || '' }}"

          PAYLOAD=$(cat <<EOF
          {
            "force": ${FORCE_PARAM},
            "isManualTrigger": ${{ github.event_name == 'workflow_dispatch' }},
            "targetProductId": "${TARGET_PROD}"
          }
          EOF
          )

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${BACKEND_URL}/api/automation/trigger-daily-post" \
            -H "Content-Type: application/json" \
            -H "x-automation-key: ${CRON_SECRET}" \
            -d "${PAYLOAD}")

          HTTP_BODY=$(echo "$RESPONSE" | sed '$d')
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)

          echo "Response Status Code: ${HTTP_STATUS}"
          echo "Response Body: ${HTTP_BODY}"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::error::Automated posting workflow returned HTTP status $HTTP_STATUS"
            exit 1
          fi

          echo "Daily workflow executed successfully."
